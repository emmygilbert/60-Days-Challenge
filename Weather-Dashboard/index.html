<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p class="subtitle">Get real-time weather information</p>
        </header>

        <div class="search-section">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..." 
                class="search-input"
            >
            <button id="searchBtn" class="search-btn">Search</button>
            <button id="currentLocationBtn" class="location-btn">📍 Current Location</button>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <div id="weatherContainer" class="weather-container hidden">
            <!-- Current Weather -->
            <div class="current-weather">
                <div class="city-info">
                    <h2 id="cityName"></h2>
                    <p id="weatherDescription"></p>
                </div>
                <div class="temperature-display">
                    <div id="temperature" class="temperature"></div>
                    <div id="weatherIcon" class="weather-icon"></div>
                </div>
            </div>

            <!-- Weather Details -->
            <div class="weather-details">
                <div class="detail-card">
                    <span class="detail-label">💧 Humidity</span>
                    <span id="humidity" class="detail-value"></span>
                </div>
                <div class="detail-card">
                    <span class="detail-label">💨 Wind Speed</span>
                    <span id="windSpeed" class="detail-value"></span>
                </div>
                <div class="detail-card">
                    <span class="detail-label">🔽 Pressure</span>
                    <span id="pressure" class="detail-value"></span>
                </div>
                <div class="detail-card">
                    <span class="detail-label">👁️ Visibility</span>
                    <span id="visibility" class="detail-value"></span>
                </div>
                <div class="detail-card">
                    <span class="detail-label">🌍 Feels Like</span>
                    <span id="feelsLike" class="detail-value"></span>
                </div>
                <div class="detail-card">
                    <span class="detail-label">📊 UV Index</span>
                    <span id="uvIndex" class="detail-value"></span>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-container"></div>
            </div>

            <!-- Sunrise & Sunset -->
            <div class="sun-times">
                <div class="sun-card">
                    <span class="sun-label">🌅 Sunrise</span>
                    <span id="sunrise" class="sun-value"></span>
                </div>
                <div class="sun-card">
                    <span class="sun-label">🌇 Sunset</span>
                    <span id="sunset" class="sun-value"></span>
                </div>
            </div>
        </div>

        <footer>
            <p>Data provided by OpenWeatherMap API</p>
            <p class="last-updated" id="lastUpdated"></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
